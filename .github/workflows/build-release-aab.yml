name: Build Release AAB (Google Play Console)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java version: $JAVA_VER"
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Java 17 or higher required."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PWD: ${{ secrets.STORE_PASSWORD }}
          KEY_PWD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding provided release keystore secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > ./my-upload-key.jks
          elif [ ! -f ./my-upload-key.jks ]; then
            echo "Generating release upload keystore..."
            keytool -genkey -v -keystore ./my-upload-key.jks \
              -storepass "${STORE_PWD:-android}" \
              -alias upload \
              -keypass "${KEY_PWD:-android}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Home Library,O=HomeLibrary,C=US"
          fi
          if [ ! -f ./my-upload-key.jks ]; then
            echo "Error: Keystore not found or could not be generated."
            exit 1
          fi
          echo "Keystore successfully prepared."

      - name: Build Release App Bundle (.aab)
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          gradle :app:bundleRelease --stacktrace --no-daemon

      - name: Verify Release AAB file
        run: |
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "Error: Expected AAB file not found at $AAB_PATH"
            find app/build/outputs/bundle -maxdepth 3 -type f || true
            exit 1
          fi
          if [ ! -s "$AAB_PATH" ]; then
            echo "Error: $AAB_PATH is empty."
            exit 1
          fi
          echo "Release AAB verified successfully: $(stat -c%s "$AAB_PATH") bytes."

      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Prepare AAB release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/bundle/release/app-release.aab "$TMP_DIR/app-release.aab"
          echo "asset_path=$TMP_DIR/app-release.aab" >> $GITHUB_OUTPUT
          echo "Prepared release asset at $TMP_DIR/app-release.aab"

      - name: Publish AAB to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET" ]; then
            echo "Error: Asset file $ASSET missing."
            exit 1
          fi
          TAG="release-aab-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Play Console Release AAB Build #${{ github.run_number }}"
          NOTES=$(cat <<EOF
          ### Google Play Console Release Bundle (.aab)
          - **File:** \`app-release.aab\`
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Target Commit:** ${{ github.sha }}
          - **Format:** Android App Bundle (AAB) optimized for Google Play Console publication.
          EOF
          )
          gh release create "$TAG" "$ASSET" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report AAB download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-release.aab"
            echo "Direct AAB Download URL: $DOWNLOAD_URL"
            {
              echo "## DIRECT PLAY CONSOLE AAB DOWNLOAD"
              echo ""
              echo "[Download app-release.aab]($DOWNLOAD_URL)"
              echo ""
              echo "*Ready to upload to Google Play Console.*"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Release publication failed. Artifact app-release-aab remains available in GitHub Actions."
          fi
