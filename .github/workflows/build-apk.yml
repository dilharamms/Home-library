name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME is: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java major version."
            exit 1
          fi
          if [ "$JAVA_VER" -lt 17 ]; then
            echo "Error: Active Java version ($JAVA_VER) is lower than 17."
            exit 1
          fi
          echo "Java environment verified successfully (version $JAVA_VER >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "Debug keystore already exists."
          fi
          if [ ! -f ./debug.keystore ]; then
            echo "Error: ./debug.keystore could not be found or created."
            exit 1
          fi
          echo "Debug keystore confirmed."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            echo "Searching app/build/outputs/apk for any generated APKs:"
            find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk" || true
            exit 1
          fi
          if [ ! -s "$APK_PATH" ]; then
            echo "Error: APK file $APK_PATH is empty."
            exit 1
          fi
          if [[ "$APK_PATH" != *.apk ]]; then
            echo "Error: File $APK_PATH does not have .apk extension."
            exit 1
          fi
          echo "Successfully verified APK at $APK_PATH ($(stat -c%s "$APK_PATH") bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR=$(mktemp -d)
          cp app/build/outputs/apk/debug/app-debug.apk "$TMP_DIR/app-debug.apk"
          echo "asset_path=$TMP_DIR/app-debug.apk" >> $GITHUB_OUTPUT
          echo "Prepared release asset at $TMP_DIR/app-debug.apk"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET" ] || [ ! -s "$ASSET" ]; then
            echo "Error: Prepared asset is missing or empty."
            exit 1
          fi
          if [ "$(basename "$ASSET")" != "app-debug.apk" ]; then
            echo "Error: Asset filename is not app-debug.apk."
            exit 1
          fi
          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          NOTES=$(cat <<EOF
          ### Automated Debug APK Build
          - Built automatically by GitHub Actions.
          - **Run Number:** ${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Commit SHA:** ${{ github.sha }}
          - **Notice:** This APK is intended for testing and development. It is signed with a temporary debug keystore and is not a Play Store production release.
          EOF
          )
          gh release create "$TAG" "$ASSET" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            echo "GitHub Release successfully created with tag: $TAG"
            gh release view "$TAG" || true
            DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
            echo "APK Filename: app-debug.apk"
            echo "Direct Download URL: $DOWNLOAD_URL"
            {
              echo "## DIRECT APK DOWNLOAD"
              echo ""
              echo "[Download app-debug.apk]($DOWNLOAD_URL)"
              echo ""
              echo "*Note: The standard GitHub Actions backup artifact \`app-debug-apk\` also remains available.*"
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release creation did not complete successfully."
            if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
              echo "The APK build itself succeeded and the Actions artifact \`app-debug-apk\` remains available as a backup."
            fi
          fi
